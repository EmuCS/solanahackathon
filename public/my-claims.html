<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FraudBusters" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <title>My claims · FraudBusters</title>
  <link rel="stylesheet" href="/app.css" />
  <script src="/vendor/nacl-fast.min.js"></script>
</head>
<body>
  <main style="max-width:760px">
    <p class="eyebrow">Claimant app</p>
    <h1>My claims</h1>
    <div class="card walletcard" style="margin-top:18px">
      <p class="muted small" style="margin:0">Payments received</p>
      <p class="amount" id="balance">—</p>
      <div class="sep" id="wallet"></div>
    </div>
    <div id="offers"></div>
    <div class="claimlist" id="rows"><div class="empty">Loading…</div></div>
  </main>

  <script type="module">
    import { nav, deviceAddress, esc, eur, fmtTime, claimantBadge, post, signOfferAnswer } from '/device.js';
    import { mountPayoutWallet } from '/wallet.js';
    nav('/my-claims.html', 'claimant');
    const $ = (id) => document.getElementById(id);
    const me = deviceAddress();
    let payTo = me; // linked Phantom / Solflare wallet, else this device
    mountPayoutWallet($('wallet'), me, (addr) => ((payTo = addr), load()), { compact: true });

    let loadSeq = 0;
    async function load() {
      const seq = ++loadSeq;
      const [list, b] = await Promise.all([
        fetch(`/api/my-claims/${me}`).then((r) => r.json()),
        fetch(`/api/balance/${payTo}`).then((r) => r.json()),
      ]);
      if (seq !== loadSeq) return; // a newer refresh started meanwhile: never redraw with older data
      $('balance').innerHTML = `${b.amount.toLocaleString('en-IE', { minimumFractionDigits: 2 })}<small>${esc(b.symbol)}</small>`;
      $('rows').innerHTML = list.length
        ? list
            .map(
              (c) => `<div class="claimitem">
                <img src="${esc(c.image)}" alt="" loading="lazy" />
                <div>
                  <b>${esc(c.description || 'Claim')}</b>
                  <div class="meta">${esc(c.insurerName)} · ${fmtTime(c.createdAt)}</div>
                  ${c.paymentExplorer ? `<div class="meta"><a href="${esc(c.paymentExplorer)}" target="_blank" rel="noopener">Payment on Solana</a></div>` : ''}
                </div>
                <div class="amt">${eur(c.paidAmount ?? c.amount)}${c.paidAmount != null && c.paidAmount !== c.amount ? `<small>of ${eur(c.amount)}</small>` : ''}<div>${claimantBadge(c.status)}</div></div>
              </div>`,
            )
            .join('')
        : '<div class="empty">No claims yet.<br><a href="/capture.html">Capture evidence</a> to start one.</div>';
      renderOffers(list.filter((c) => c.offer));
    }

    // Open offers: re-rendered only when they change, so the 3 s refresh never eats a tap
    let offersKey = '';
    let answering = false;
    function renderOffers(open) {
      const key = open.map((c) => `${c.id}:${c.offer.amount}`).join(',');
      if (key === offersKey || answering) return;
      offersKey = key;
      $('offers').innerHTML = open
        .map(
          (c) => `<div class="status offered" style="margin-top:16px">
            <h3>${esc(c.insurerName)} offers ${eur(c.offer.amount)}</h3>
            <p class="small">For “${esc(c.description || 'your claim')}” (you claimed ${eur(c.amount)}).</p>
            ${c.offer.note ? `<p class="small" style="margin-top:6px">“${esc(c.offer.note)}”</p>` : ''}
            <div class="row" style="margin-top:12px">
              <button class="btn" data-id="${esc(c.id)}" data-amt="${c.offer.amount}" data-act="accept">Accept ${eur(c.offer.amount)}</button>
              <button class="btn secondary" data-id="${esc(c.id)}" data-amt="${c.offer.amount}" data-act="decline">Decline</button>
            </div>
            <p class="small muted msg" style="margin:8px 0 0"></p>
          </div>`,
        )
        .join('');
      $('offers').querySelectorAll('button').forEach((b) => {
        b.onclick = async () => {
          const card = b.closest('.status');
          const { id, amt, act } = b.dataset;
          card.querySelectorAll('button').forEach((x) => (x.disabled = true));
          card.querySelector('.msg').textContent = act === 'accept' ? 'Accepting and receiving payment…' : 'Sending your answer…';
          answering = true;
          try {
            await post(`/api/my-claims/${id}/respond`, { action: act, signature: signOfferAnswer(id, act, amt) });
            card.querySelector('.msg').textContent = act === 'accept' ? `Accepted: ${eur(Number(amt))} is on its way.` : 'Declined: your insurer will review the claim again.';
          } catch (e) {
            card.querySelector('.msg').textContent = e.message;
            card.querySelectorAll('button').forEach((x) => (x.disabled = false));
          } finally {
            answering = false;
            offersKey = null; // force a redraw so the answered card disappears
            setTimeout(load, 1500);
          }
        };
      });
    }
    load();
    setInterval(load, 3000);
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FraudBusters" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <title>Submit claim · FraudBusters</title>
  <link rel="stylesheet" href="/app.css" />
  <script src="/vendor/nacl-fast.min.js"></script>
</head>
<body>
  <main>
    <p class="eyebrow">Claimant app</p>
    <h1>Submit a claim</h1>
    <p class="lede">Your insurer reviews every claim. Once approved, the payment reaches you within seconds.</p>

    <div class="two" style="margin-top:24px">
      <form class="card" id="form">
        <label style="margin-top:0">1 · Evidence</label>
        <div class="picker" id="picker"><span class="muted small">No captures on this device yet. <a href="/capture.html">Capture evidence</a></span></div>
        <div class="shotstrip" id="strip"></div>
        <img id="preview" class="preview" hidden style="margin-top:14px" alt="Selected evidence" />
        <details>
          <summary>Upload a photo taken elsewhere (slower review)</summary>
          <input id="image" type="file" accept="image/*" style="margin-top:8px" />
        </details>

        <label for="description">2 · What happened?</label>
        <textarea id="description" rows="3" maxlength="280" placeholder="e.g. Phone slipped off the desk, screen cracked in the top corner" required></textarea>
        <label for="amount">3 · Amount claimed</label>
        <div class="money"><span>€</span><input id="amount" type="number" inputmode="decimal" min="1" max="10000" step="0.01" placeholder="0.00" required /></div>
        <label for="insurer">4 · Insurer</label>
        <select id="insurer"></select>
        <button class="btn block" id="submit" style="margin-top:20px">Submit claim</button>
      </form>

      <div>
        <div class="card" id="result" hidden style="margin-bottom:14px"></div>
        <div class="card walletcard">
          <p class="muted small" style="margin:0">Payments received</p>
          <p class="amount" id="balance">—</p>
          <div class="sep" id="wallet"></div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { nav, deviceAddress, post, esc, eur, claimantBadge } from '/device.js';
    import { mountPayoutWallet } from '/wallet.js';
    nav('/claim.html', 'claimant');
    const $ = (id) => document.getElementById(id);
    const me = deviceAddress();
    let payTo = me; // linked Phantom / Solflare wallet, else this device
    mountPayoutWallet($('wallet'), me, (a) => ((payTo = a), refreshBalance()), { compact: true });

    const cfg = await fetch('/api/config').then((r) => r.json());
    $('insurer').innerHTML = Object.entries(cfg.insurers).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('');

    async function refreshBalance() {
      const b = await fetch(`/api/balance/${payTo}`).then((r) => r.json());
      $('balance').innerHTML = `${b.amount.toLocaleString('en-IE', { minimumFractionDigits: 2 })}<small>${esc(b.symbol)}</small>`;
    }
    refreshBalance();
    setInterval(refreshBalance, 5000);

    // Evidence = a guided 3-shot set, or an older single capture
    const params = new URLSearchParams(location.search);
    let selected = params.get('set') ? { set: params.get('set') } : params.get('photo') ? { photo: params.get('photo') } : null;
    const ORDER = ['wide', 'close', 'angle'];
    const shotName = (p) => (!p.shot ? 'Single photo' : p.side ? `From the ${p.side}` : { wide: 'Wide', close: 'Close-up' }[p.shot]);
    const mine = await fetch(`/api/photos?device=${me}`).then((r) => r.json());
    const sets = new Map();
    const items = [];
    for (const p of mine) {
      if (!p.set) items.push({ key: `photo:${p.id}`, sel: { photo: p.id }, cover: p.image, shots: [p], at: p.capturedAt });
      else sets.set(p.set, [...(sets.get(p.set) || []), p]);
    }
    for (const [id, shots] of sets) {
      if (shots.length < 3) continue; // incomplete sets can't be claimed
      shots.sort((a, b) => ORDER.indexOf(a.shot) - ORDER.indexOf(b.shot));
      items.push({ key: `set:${id}`, sel: { set: id }, cover: shots[1].image, shots, at: shots[2].capturedAt });
    }
    items.sort((a, b) => b.at.localeCompare(a.at));
    const keyOf = (s) => (s?.set ? `set:${s.set}` : s?.photo ? `photo:${s.photo}` : '');
    function select(item) {
      selected = item.sel;
      [...$('picker').querySelectorAll('button')].forEach((b) => b.classList.toggle('sel', b.dataset.key === item.key));
      $('image').value = '';
      $('preview').hidden = true;
      $('strip').innerHTML = item.shots
        .map((p) => `<figure><img src="${p.image}" alt="${esc(shotName(p))}" /><figcaption>${esc(shotName(p))}</figcaption></figure>`)
        .join('');
    }
    if (items.length) {
      $('picker').innerHTML = items
        .map((it) => `<button type="button" data-key="${it.key}"><img src="${it.cover}" alt="Capture" /><span class="tag">${it.sel.set ? '3 shots' : '1 photo'}</span></button>`)
        .join('');
      $('picker').querySelectorAll('button').forEach((b) => (b.onclick = () => select(items.find((it) => it.key === b.dataset.key))));
      select(items.find((it) => it.key === keyOf(selected)) || items[0]);
    }

    $('image').onchange = (e) => {
      const f = e.target.files[0];
      if (!f) return;
      selected = null;
      $('picker').querySelectorAll('button').forEach((b) => b.classList.remove('sel'));
      $('strip').innerHTML = '';
      $('preview').src = URL.createObjectURL(f);
      $('preview').hidden = false;
    };

    $('form').onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData();
      fd.append('insurer', $('insurer').value);
      fd.append('amount', $('amount').value);
      fd.append('description', $('description').value);
      fd.append('pubkey', me);
      if (selected?.set) fd.append('setId', selected.set);
      else if (selected?.photo) fd.append('photoId', selected.photo);
      else if ($('image').files[0]) fd.append('image', $('image').files[0]);
      else return alert('Select a capture or upload a photo');

      $('submit').disabled = true;
      $('submit').textContent = 'Submitting…';
      $('result').hidden = false;
      $('result').scrollIntoView({ behavior: 'smooth', block: 'center' });
      $('result').innerHTML = '<p class="muted" style="margin:0">Sending your claim and evidence to your insurer…</p>';
      try {
        const { receipt: r } = await post('/api/claims', fd);
        $('result').innerHTML = `
          <div class="status review" style="margin-top:0">
            <h3>Claim submitted</h3>
            <p class="small">Reference <span class="mono">${esc(r.id)}</span> · ${esc(r.insurerName)} · ${eur(r.amount)}</p>
          </div>
          <p class="small" style="margin:12px 0 0">Status ${claimantBadge(r.status)}. You’ll see the decision in <a href="/my-claims.html">My claims</a>; approved payments arrive on this device.</p>`;
      } catch (err) {
        $('result').innerHTML = `<div class="status flagged" style="margin-top:0"><h3>Could not submit</h3><p class="small">${esc(err.message)}</p></div>`;
      } finally {
        $('submit').disabled = false;
        $('submit').textContent = 'Submit claim';
      }
    };
  </script>
</body>
</html>
